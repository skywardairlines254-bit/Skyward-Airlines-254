<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine | Skyward Airlines</title>
<meta name="description" content="Travel stories, destination guides and regional travel tips from Skyward Airlines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">

</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / About Us / Magazine</div>
      <h1 style="color:white;font-size:clamp(26px,4vw,38px);">The Skyward Magazine</h1>
      <p style="color:#E8C7CA;max-width:560px;margin-top:10px;">Destination stories and travel tips from across our network.</p>
    </div>
  </div>
  <section class="section">
    <div class="container">
      <a href="news-article.html?id=n2" class="dest-card mb-32" style="display:grid;grid-template-columns:1.2fr 1fr;">
        <div class="card-media" style="aspect-ratio:auto;"><div class="photo-block grad-terracotta" style="height:100%;background-image:url('images/ukunda-diani.jpg');"></div></div>
        <div class="card-body">
          <span class="tag">Featured Story</span>
          <h4 style="font-size:22px;">Five reasons to fly into Diani via Ukunda</h4>
          <p>Skip the Mombasa road traffic — our short guide to making the most of Kenya's award-winning south coast.</p>
        </div>
      </a>
      <div class="tab-strip" id="magTabs"></div>
      <div class="card-grid grid-3" id="magGrid"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader("about"); renderFooter();
  const cats = ["All", "Destination Guides", "Travel Tips", "Regional Travel"];
  const articles = [
    { id:"a1", cat:"Destination Guides", title: "A weekend in Lamu Old Town", excerpt: "Getting around the UNESCO-listed island without a single car.", image: "images/lamu.jpg" },
    { id:"a2", cat:"Travel Tips", title: "Packing light for coastal Kenya", excerpt: "What actually fits in a 15kg allowance for a beach trip.", image: "images/mombasa.jpg" },
    { id:"a3", cat:"Regional Travel", title: "Turkana by air: what to expect", excerpt: "Notes from our first season flying into Lodwar.", image: "images/lodwar.jpg" },
    { id:"a4", cat:"Destination Guides", title: "Kisumu's lakefront in a day", excerpt: "From the Impala Sanctuary to sunset on Lake Victoria.", image: "images/kisumu.jpg" },
    { id:"a5", cat:"Travel Tips", title: "Booking for a group without the back-and-forth", excerpt: "How our passenger step handles multiple travellers cleanly." },
    { id:"a6", cat:"Regional Travel", title: "Crossing to Entebbe for the weekend", excerpt: "What documents you need, and what to do once you land.", image: "images/entebbe.jpg" }
  ];
  let active = "All";
  function tabs(){ document.getElementById("magTabs").innerHTML = cats.map(c=>`<button class="${c===active?'active':''}" data-c="${c}">${c}</button>`).join(""); document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.c;tabs();grid();})); }
  function grid(){
    const list = active==="All"?articles:articles.filter(a=>a.cat===active);
    document.getElementById("magGrid").innerHTML = list.map(a=>`
      <div class="news-card">
        <div class="card-media">${mediaBlock(a.image, "grad-sky", a.title)}</div>
        <div class="card-body"><span class="tag">${a.cat}</span><h4>${a.title}</h4><p>${a.excerpt}</p></div>
      </div>`).join("");
  }
  tabs(); grid();
</script>
</body>
</html>
